name: Character request
description: Ask for a character or language Alawonn doesn't cover yet.
labels: [characters]
body:
  - type: input
    id: characters
    attributes:
      label: Characters or language
      description: The characters you need, with code points if you know them.
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What you'd use them for
