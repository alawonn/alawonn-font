name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  font:
    name: Build and check the font
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: pip install -r requirements.txt && pip install -e . --no-deps
      - run: npm ci

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Release checks (rebuild, OTS, FontBakery, package)
        run: python tools/check.py

      - name: Committed files match a clean build
        run: git diff --exit-code -- dist specimen demo/src/characters.json demo/public/favicon.svg

  demo:
    name: Demo in Chromium, Firefox and WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run demo:build
      - run: npm run demo:test

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  consumers:
    name: Framework examples against the packed package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: corepack enable
      - run: npm run consumers
